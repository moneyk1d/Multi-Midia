<style>
  /* ---------- Tokens ---------- */
  :root{
    --bg:#0a0a0a;
    --bg-soft:#121212;
    --panel:#161616;
    --line:#262626;
    --orange:#ff6a00;
    --orange-light:#ff9a3d;
    --orange-dark:#c94e00;
    --white:#f5f5f5;
    --gray:#9a9a9a;
    --gray-dim:#6b6b6b;
    --radius:14px;
    --ease:cubic-bezier(.16,.84,.44,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body.intro-locked{ overflow:hidden; height:100vh; }
  h1,h2,h3, .display{
    font-family:'Archivo Black','Inter',sans-serif;
    line-height:1.05;
    letter-spacing:-.01em;
  }
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  img{max-width:100%;display:block;}
  section{position:relative;}
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 28px;
  }
  ::selection{background:var(--orange);color:#0a0a0a;}

  /* focus visibility for accessibility */
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--orange-light);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
  }

  /* ---------- Nav ---------- */
  header.nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;
    background:rgba(10,10,10,.65);
    backdrop-filter:blur(10px);
    border-bottom:1px solid transparent;
    transition:border-color .3s var(--ease), background .3s var(--ease);
  }
  header.nav.scrolled{
    border-bottom:1px solid var(--line);
    background:rgba(10,10,10,.92);
  }
  .nav-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;}
  .nav-logo img{height:36px;width:36px;object-fit:contain;}
  .nav-logo span b{color:var(--orange);}
  nav.links{display:flex;gap:30px;}
  nav.links a{
    font-size:.92rem;font-weight:600;color:var(--gray);
    position:relative;padding:6px 0;
    transition:color .25s;
  }
  nav.links a::after{
    content:'';position:absolute;left:0;bottom:0;height:2px;width:0;
    background:var(--orange);transition:width .3s var(--ease);
  }
  nav.links a:hover{color:var(--white);}
  nav.links a:hover::after{width:100%;}
  .nav-cta{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--orange);color:#0a0a0a;font-weight:700;font-size:.9rem;
    padding:10px 18px;border-radius:999px;
    box-shadow:0 0 0 0 rgba(255,106,0,.5);
    transition:transform .25s var(--ease), box-shadow .25s var(--ease), background .25s;
  }
  .nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,106,0,.35);background:var(--orange-light);}
  .burger{display:none;background:none;border:none;color:var(--white);font-size:1.6rem;}

  /* ---------- Hero ---------- */
  .hero{
    min-height:100vh;
    display:flex;flex-direction:column;justify-content:center;
    padding-top:110px;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(255,106,0,.16), transparent 70%),
      var(--bg);
    overflow:hidden;
  }
  .hero-inner{
    position:relative;z-index:3;
    text-align:center;
    padding-bottom:40px;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--orange-light);font-weight:600;font-size:.85rem;
    margin-bottom:22px;
    opacity:0;animation:riseIn .7s var(--ease) .1s forwards;
  }
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);animation:pulseDot 1.6s ease-in-out infinite;}
  h1.hero-title{
    font-size:clamp(2.4rem, 6.2vw, 5rem);
    color:var(--white);
    opacity:0;animation:riseIn .8s var(--ease) .25s forwards;
  }
  h1.hero-title em{
    font-style:normal;
    color:var(--orange);
    background:linear-gradient(100deg,var(--orange),var(--orange-light));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero-sub{
    max-width:560px;margin:22px auto 0;
    color:var(--gray);font-size:1.08rem;font-weight:500;
    opacity:0;animation:riseIn .8s var(--ease) .45s forwards;
  }
  .hero-actions{
    display:flex;gap:16px;justify-content:center;margin-top:36px;flex-wrap:wrap;
    opacity:0;animation:riseIn .8s var(--ease) .62s forwards;
  }
  @keyframes riseIn{ from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:translateY(0);} }
  @keyframes pulseDot{ 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(1.4);} }

  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:15px 28px;border-radius:999px;
    font-weight:700;font-size:.95rem;
    border:none;cursor:pointer;
    transition:transform .25s var(--ease), box-shadow .3s var(--ease), background .25s;
  }
  .btn-primary{
    background:var(--orange);color:#0a0a0a;
    box-shadow:0 0 0 0 rgba(255,106,0,.55);
    animation:glowPulse 2.6s ease-in-out infinite;
  }
  .btn-primary:hover{transform:translateY(-3px) scale(1.02);background:var(--orange-light);}
  @keyframes glowPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,106,0,.45);}
    50%{box-shadow:0 0 26px 6px rgba(255,106,0,.35);}
  }
  .btn-ghost{
    background:transparent;color:var(--white);
    border:1.5px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--orange);color:var(--orange-light);transform:translateY(-3px);}
  .btn svg{width:18px;height:18px;flex-shrink:0;}

  /* ---------- Road / truck scene ---------- */
  .scene{
    position:relative;
    height:min(46vw, 380px);
    min-height:230px;
    margin-top:10px;
  }
  .skyline{
    position:absolute;left:0;right:0;bottom:78px;height:60%;
    opacity:.5;
    background-repeat:repeat-x;background-size:auto 100%;
    animation:driftBack 34s linear infinite;
    -webkit-mask-image:linear-gradient(to top, black 55%, transparent 100%);
            mask-image:linear-gradient(to top, black 55%, transparent 100%);
  }
  @keyframes driftBack{ from{background-position-x:0;} to{background-position-x:-1200px;} }

  .road{
    position:absolute;left:0;right:0;bottom:0;height:78px;
    background:linear-gradient(to bottom, #1b1b1b, #0f0f0f);
    border-top:2px solid #2c2c2c;
  }
  .road::before{ /* dashed centerline, animated */
    content:'';position:absolute;top:50%;left:0;right:0;height:6px;transform:translateY(-50%);
    background-image:repeating-linear-gradient(to right, var(--gray-dim) 0 46px, transparent 46px 90px);
    animation:dashMove 1.1s linear infinite;
  }
  @keyframes dashMove{ from{background-position-x:0;} to{background-position-x:-90px;} }

  .truck-rig{
    position:absolute; bottom:66px; left:-42%;
    width:38%; min-width:300px; max-width:560px;
    animation:driveAcross 13s linear infinite;
    filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));
  }
  @keyframes driveAcross{
    0%{ left:-42%; }
    100%{ left:104%; }
  }
  .truck-rig svg{width:100%;height:auto;display:block;}
  .wheel{transform-origin:center;animation:spin .5s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .panel-glow{ animation:panelFlicker 3.2s ease-in-out infinite; }
  @keyframes panelFlicker{
    0%,100%{opacity:1;}
    48%{opacity:1;}
    50%{opacity:.85;}
    52%{opacity:1;}
  }
  .beam{
    transform-origin:left center;
    animation:beamSway 2.4s ease-in-out infinite;
  }
  @keyframes beamSway{
    0%,100%{ transform:rotate(-4deg); opacity:.9; }
    50%{ transform:rotate(6deg); opacity:.55; }
  }
  .exhaust{
    animation:puff 1.8s ease-out infinite;
  }
  @keyframes puff{
    0%{ opacity:0; transform:translate(0,0) scale(.4); }
    30%{ opacity:.5; }
    100%{ opacity:0; transform:translate(-18px,-14px) scale(1.3); }
  }

  /* ---------- Sections generic ---------- */
  .section-head{
    max-width:640px;margin:0 auto 56px;text-align:center;
  }
  .section-tag{
    color:var(--orange-light);font-weight:700;font-size:.85rem;
    letter-spacing:.02em;margin-bottom:14px;display:block;
  }
  .section-head h2{
    font-size:clamp(1.8rem,3.6vw,2.6rem);
    color:var(--white);
  }
  .section-head p{
    color:var(--gray);margin-top:16px;font-size:1.02rem;line-height:1.6;
  }

  /* reveal-on-scroll (single subtle effect reused, not stacked with entrance elsewhere) */
  .reveal{
    opacity:0; transform:translateY(26px);
    transition:opacity .7s var(--ease), transform .7s var(--ease);
  }
  .reveal.in{opacity:1;transform:translateY(0);}

  /* ---------- Como funciona ---------- */
  .how{padding:120px 0 100px;background:var(--bg);}
  .steps{
    display:grid;grid-template-columns:repeat(3,1fr);gap:26px;
  }
  .step{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:34px 28px;
    transition:border-color .3s, transform .3s var(--ease);
  }
  .step:hover{border-color:var(--orange);transform:translateY(-6px);}
  .step .num{
    font-family:'Archivo Black';font-size:2.6rem;color:var(--orange);
    opacity:.9;line-height:1;
  }
  .step h3{font-size:1.15rem;margin:18px 0 10px;color:var(--white);}
  .step p{color:var(--gray);font-size:.95rem;line-height:1.6;}

  /* ---------- Vantagens ---------- */
  .perks{padding:100px 0;background:var(--bg-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .perk-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
  }
  .perk{
    text-align:center;padding:30px 18px;
  }
  .perk .ic{
    width:58px;height:58px;margin:0 auto 18px;
    border-radius:16px;
    background:linear-gradient(150deg,var(--orange),var(--orange-dark));
    display:flex;align-items:center;justify-content:center;
    transition:transform .35s var(--ease);
  }
  .perk:hover .ic{transform:rotate(-8deg) scale(1.08);}
  .perk .ic svg{width:26px;height:26px;stroke:#0a0a0a;}
  .perk h3{font-size:1.02rem;margin-bottom:8px;}
  .perk p{color:var(--gray);font-size:.9rem;line-height:1.55;}

  /* ---------- Negociar ---------- */
  .plans{padding:120px 0 110px;}

  /* ---------- Área de atuação ---------- */
  .coverage{
    padding:100px 0;background:var(--bg-soft);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .coverage-inner{
    display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center;
  }
  .coverage h2{font-size:clamp(1.7rem,3.2vw,2.3rem);margin-bottom:18px;}
  .coverage p{color:var(--gray);line-height:1.7;margin-bottom:26px;}
  .stat-row{display:flex;gap:34px;flex-wrap:wrap;}
  .stat b{font-family:'Archivo Black';font-size:2rem;color:var(--orange);display:block;}
  .stat span{color:var(--gray);font-size:.85rem;}
  .radar{
    position:relative;aspect-ratio:1/1;border-radius:50%;
    background:radial-gradient(circle, rgba(255,106,0,.14), transparent 70%);
    display:flex;align-items:center;justify-content:center;
  }
  .radar .ring{
    position:absolute;border:1px solid rgba(255,106,0,.35);border-radius:50%;
  }
  .radar .r1{width:35%;height:35%;}
  .radar .r2{width:62%;height:62%;}
  .radar .r3{width:90%;height:90%;}
  .radar .sweep{
    position:absolute;width:50%;height:2px;left:50%;top:50%;
    background:linear-gradient(to right, var(--orange), transparent);
    transform-origin:left center;
    animation:sweep 3.4s linear infinite;
  }
  @keyframes sweep{ to{ transform:rotate(360deg); } }
  .radar .core{
    width:16%;height:16%;border-radius:50%;background:var(--orange);
    box-shadow:0 0 24px 6px rgba(255,106,0,.6);
    z-index:2;
  }

  /* ---------- Case / na rua ---------- */
  .case{padding:110px 0;background:var(--bg);}
  .case-inner{
    display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center;
  }
  .case-photo{
    position:relative;border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .case-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .case-tag{
    position:absolute;top:18px;left:18px;
    background:var(--orange);color:#0a0a0a;font-weight:700;font-size:.78rem;
    padding:7px 14px;border-radius:999px;letter-spacing:.02em;
  }
  .case-copy h2{font-size:clamp(1.7rem,3.2vw,2.3rem);margin-bottom:18px;}
  .case-copy p{color:var(--gray);line-height:1.7;margin-bottom:26px;}
  .case-copy .stat-row{margin-bottom:30px;}

  /* ---------- Avaliações ---------- */
  .reviews{
    padding:100px 0;background:var(--bg-soft);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .review-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:22px;
  }
  .review-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px 26px;transition:border-color .3s, transform .3s var(--ease);
  }
  .review-card:hover{border-color:var(--orange);transform:translateY(-6px);}
  .review-stars{color:var(--orange);font-size:1rem;letter-spacing:2px;margin-bottom:16px;}
  .review-card p{color:var(--white);font-size:.96rem;line-height:1.65;margin-bottom:22px;}
  .review-author{display:flex;align-items:center;gap:12px;}
  .review-avatar{
    width:42px;height:42px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,var(--orange),var(--orange-dark));
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black';color:#0a0a0a;font-size:.95rem;
  }
  .review-author b{display:block;font-size:.92rem;}
  .review-author span{display:block;color:var(--gray-dim);font-size:.8rem;}

  /* ---------- CTA final ---------- */
  .cta-final{
    padding:110px 0;text-align:center;
    background:
      radial-gradient(ellipse 70% 80% at 50% 100%, rgba(255,106,0,.18), transparent 70%),
      var(--bg);
  }
  .cta-final h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:18px;}
  .cta-final p{color:var(--gray);max-width:480px;margin:0 auto 34px;line-height:1.6;}

  /* ---------- Footer ---------- */
  footer{
    padding:50px 0 30px;border-top:1px solid var(--line);background:var(--bg);
  }
  .foot-top{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px;margin-bottom:34px;
  }
  .foot-logo{display:flex;align-items:center;gap:10px;font-weight:800;}
  .foot-logo img{height:32px;width:32px;object-fit:contain;}
  .foot-links{display:flex;gap:26px;flex-wrap:wrap;}
  .foot-links a{color:var(--gray);font-size:.9rem;transition:color .25s;}
  .foot-links a:hover{color:var(--orange-light);}
  .foot-bottom{
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
    color:var(--gray-dim);font-size:.82rem;padding-top:22px;border-top:1px solid var(--line);
  }

  /* ---------- Intro / abertura ---------- */
  #intro{
    position:fixed;inset:0;z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse 70% 60% at 50% 40%, rgba(255,106,0,.16), transparent 70%),
      var(--bg);
    overflow:hidden;
    transition:opacity .6s var(--ease), transform .6s var(--ease);
  }
  #intro.exit{ opacity:0; transform:scale(1.06); pointer-events:none; }

  .intro-stage{
    width:min(90vw, 380px);
    margin-bottom:8px;
  }
  .intro-stage svg{ width:100%; height:auto; overflow:visible; }

  /* truck drives in once, then settles with a squash-bounce, cartoon-style */
  .intro-truck{
    animation:
      introDriveIn 1.15s var(--ease) forwards,
      introSquash .5s ease-out 1.1s forwards;
  }
  @keyframes introDriveIn{
    from{ transform:translateX(-220px); }
    to{ transform:translateX(0); }
  }
  @keyframes introSquash{
    0%{ transform:scale(1,1) translateX(0); }
    35%{ transform:scale(1.06,.9) translateX(0); }
    60%{ transform:scale(.96,1.05) translateX(0); }
    100%{ transform:scale(1,1) translateX(0); }
  }
  .intro-wheel{ animation:spin .45s linear infinite; transform-origin:center; }
  .intro-beam{
    transform-origin:left center;
    opacity:0;
    animation:introBeam .3s ease-out 1.2s forwards, beamSway 2.2s ease-in-out 1.5s infinite;
  }
  @keyframes introBeam{ to{ opacity:1; } }

  .intro-dust{
    opacity:0;
    animation:introDust .7s ease-out 1.05s forwards;
  }
  @keyframes introDust{
    0%{ opacity:0; transform:translate(0,0) scale(.3); }
    40%{ opacity:.5; }
    100%{ opacity:0; transform:translate(-26px,4px) scale(1.6); }
  }

  .intro-word{
    display:inline-block;
    opacity:0;
    transform:translateY(28px) scale(.85);
    animation:introWordIn .6s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes introWordIn{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  h2.intro-title{
    font-size:clamp(2rem,7vw,3.4rem);
    margin-top:6px;
  }
  .intro-title .w-multi{ color:var(--white); animation-delay:1.5s; }
  .intro-title .w-midia{ color:var(--orange); animation-delay:1.7s; }

  .intro-sub{
    color:var(--gray);font-size:1rem;font-weight:500;margin-top:14px;
    opacity:0;transform:translateY(14px);
    animation:riseIn .6s var(--ease) 2s forwards;
  }
  .intro-enter{
    margin-top:38px;
    opacity:0;transform:translateY(14px) scale(.94);
    animation:riseIn .6s var(--ease) 2.5s forwards;
  }
  .intro-skip{
    position:absolute;top:24px;right:26px;
    color:var(--gray-dim);font-size:.85rem;font-weight:600;
    padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    opacity:0;animation:riseIn .5s var(--ease) 1s forwards;
    transition:color .25s, border-color .25s;
  }
  .intro-skip:hover{ color:var(--white); border-color:var(--orange); }

  @media (prefers-reduced-motion: reduce){
    #intro{ display:none !important; }
  }

  /* ---------- Whatsapp float ---------- */
  .float-wa{
    position:fixed;right:22px;bottom:22px;z-index:90;
    width:60px;height:60px;border-radius:50%;
    background:#22c55e;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(34,197,94,.4);
    animation:floatBob 3s ease-in-out infinite;
    transition:transform .25s var(--ease);
  }
  .float-wa:hover{transform:scale(1.08);}
  .float-wa svg{width:28px;height:28px;fill:#0a0a0a;}
  @keyframes floatBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

  /* ---------- Responsive ---------- */
  @media (max-width:920px){
    nav.links{display:none;}
    .burger{display:block;}
    .steps{grid-template-columns:1fr;}
    .perk-grid{grid-template-columns:repeat(2,1fr);}
    .coverage-inner{grid-template-columns:1fr;}
    .radar{max-width:260px;margin:0 auto;}
    .case-inner{grid-template-columns:1fr;}
    .review-grid{grid-template-columns:1fr;}
  }
  @media (max-width:520px){
    .perk-grid{grid-template-columns:1fr;}
    .scene{height:56vw;}
  }
</style>
</head>
